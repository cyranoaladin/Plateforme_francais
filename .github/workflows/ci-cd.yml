name: "Nexus EAF - CI/CD Pipeline"

permissions:
  contents: write
  security-events: write
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Weekly smoke test — every Monday at 02:00 UTC
    - cron: "0 3 1 * *" # Monthly dependency audit — 1st of month at 03:00 UTC
  push:
    branches:
      - main
      - develop
      - "fix/**"
      - "feat/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  # Coverage thresholds raised 2026-03-31 to reflect the current floor (~35%)
  # Next target: +2% per sprint until lines/statements reach 45% and branches 35%
  COVERAGE_GATE_LINES: "40"
  COVERAGE_GATE_FUNCTIONS: "38"
  COVERAGE_GATE_BRANCHES: "32"
  COVERAGE_GATE_STATEMENTS: "40"
  DATABASE_URL: "postgresql://test:test@localhost:5432/eaf_test"
  DIRECT_URL: "postgresql://test:test@localhost:5432/eaf_test"
  REDIS_URL: "redis://localhost:6379"
  LLM_PROVIDER: "mock"
  LLM_TIER_1_PROVIDER: "mock"
  LLM_TIER_2_PROVIDER: "mock"
  LLM_TIER_3_PROVIDER: "mock"
  LLM_ROUTER_ENABLED: "false"
  LLM_COST_TRACKING: "false"
  RAG_API_URL: "http://localhost:9999"
  SESSION_SECRET: "ci_session_secret_32chars_minimum_ok_here"
  CSRF_SECRET: "ci_csrf_secret_32chars_minimum_ok_here_now"
  COOKIE_SECURE: "false"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:3000/api/v1"
  MISTRAL_API_KEY: ${{ secrets.CI_MISTRAL_API_KEY }}

jobs:
  static-analysis:
    name: "Gate 1 - Analyse Statique"
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-static-analysis-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Build shared-billing (dist/ is gitignored)
        run: npm run build:shared-billing
      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: Verify Next.js version coherence
        run: |
          INSTALLED=$(node -e "console.log(require('./node_modules/next/package.json').version)")
          DECLARED=$(node -e "const raw=require('./package.json').dependencies.next; console.log(raw.replace(/^[\\^~>=]*/,''))")
          echo "Installed: $INSTALLED | Declared (cleaned): $DECLARED"
          test "$DECLARED" = "$INSTALLED"
      - name: Check curly quotes in props
        run: npm run check:quotes
      - name: ESLint
        run: npm run lint
      - name: CSRF route audit
        run: npm run ci:audit-csrf
      - name: Contrôle copy FR — zero banned-phrases
        run: |
          npm run ci:fr-copy -- --update
          VIOLATIONS=$(node -e "
            const b = require('./config/fr-copy-baseline.json');
            console.log((b.violations || []).filter(v => v.kind === 'banned-phrase').length);
          ")
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "❌ $VIOLATIONS banned-phrase(s) détectée(s) dans le code :"
            node -e "
              const b = require('./config/fr-copy-baseline.json');
              (b.violations || [])
                .filter(v => v.kind === 'banned-phrase')
                .forEach(v => console.log('  ' + v.file + ':' + v.line + ' → \"' + v.text + '\"'));
            "
            exit 1
          fi
          echo "✅ Aucune banned-phrase détectée"
          if ! git diff --quiet config/fr-copy-baseline.json; then
            if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/heads/* ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add config/fr-copy-baseline.json
              git commit -m "chore(ci): auto-update fr-copy-baseline [skip ci]"
              git push
            else
              echo "::warning::FR baseline changed but auto-push disabled (PR context)"
              git --no-pager diff --stat config/fr-copy-baseline.json
            fi
          fi
      - name: Audit dépendances npm
        run: npx audit-ci --config .audit-ci.json
      - name: Détection code mort
        run: npx knip

  worker-build-prod-deps:
    name: "Gate 1b - Worker Build sans devDeps"
    needs: static-analysis
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-worker-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Build worker then verify it loads with prod-only deps
        run: |
          npm run build:worker
          test -s dist/worker/src/lib/queue/start-worker.js
          rm -rf node_modules
          npm ci --omit=dev
          node -e "require('./dist/worker/src/lib/queue/start-worker.js')" &
          WORKER_PID=$!
          sleep 2
          kill $WORKER_PID 2>/dev/null || true
          echo "✅ Worker artifact loads with production dependencies only"

  unit-tests:
    name: "Gate 2 - Tests Unitaires (sans postgres requis)"
    needs: [static-analysis, worker-build-prod-deps]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-unit-tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run build:shared-billing
      - name: Vitest coverage (tests unitaires uniquement)
        run: npx vitest run tests/unit --coverage
      - name: Diagnostic couverture actuelle
        run: |
          node -e "
            const fs=require('fs');
            const p='coverage/coverage-summary.json';
            if(!fs.existsSync(p)){console.log('Pas de coverage summary');process.exit(0)}
            const c=JSON.parse(fs.readFileSync(p,'utf8')).total;
            console.log('Lines:     ' + c.lines.pct + '% (gate: ' + process.env.COVERAGE_GATE_LINES + '%)');
            console.log('Functions: ' + c.functions.pct + '% (gate: ' + process.env.COVERAGE_GATE_FUNCTIONS + '%)');
            console.log('Branches:  ' + c.branches.pct + '% (gate: ' + process.env.COVERAGE_GATE_BRANCHES + '%)');
            console.log('Statements:' + c.statements.pct + '% (gate: ' + process.env.COVERAGE_GATE_STATEMENTS + '%)');
          "
        continue-on-error: true
      - name: Coverage gate (progressif, 4 métriques)
        run: |
          node -e "
            const fs=require('fs');
            const p='coverage/coverage-summary.json';
            if(!fs.existsSync(p)){console.error('Coverage summary not found');process.exit(1)}
            const c=JSON.parse(fs.readFileSync(p,'utf8')).total;
            const gates=[
              ['lines',    parseFloat(process.env.COVERAGE_GATE_LINES)],
              ['functions', parseFloat(process.env.COVERAGE_GATE_FUNCTIONS)],
              ['branches',  parseFloat(process.env.COVERAGE_GATE_BRANCHES)],
              ['statements',parseFloat(process.env.COVERAGE_GATE_STATEMENTS)]
            ];
            for(const [k,min] of gates){
              if(Number.isNaN(min)){throw new Error('COVERAGE_GATE_'+k.toUpperCase()+' not set or invalid')}
            }
            let fail=false;
            for(const [k,min] of gates){
              const v=c[k]?.pct??0;
              if(v<min){console.error('Coverage '+k+' '+v+'% < gate '+min+'%');fail=true}
              else{console.log('Coverage '+k+' '+v+'% >= gate '+min+'% ✓')}
            }
            if(fail) process.exit(1);
          "

  integration-tests:
    name: "Gate 3 - Tests Integration"
    needs: unit-tests
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-integration-tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eaf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d eaf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run build:shared-billing
      - name: Debug DB Connectivity
        run: |
          echo "Checking connectivity for: ${DATABASE_URL%%:*}"
          pg_isready -h localhost -U test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Prisma Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Seed Test Data
        run: |
          if [ -f scripts/seed-test.ts ]; then 
            npx tsx scripts/seed-test.ts
          else 
            echo "No seed-test.ts"
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Vitest integration
        run: npx vitest run tests/integration

  contract-tests:
    name: "Gate 3b - API Contract Tests"
    needs: integration-tests
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-contract-tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eaf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d eaf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      HEALTH_CHECK_READY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run build:worker
      - run: chmod +x tests/contracts/run-schemathesis.sh tests/contracts/run-schemathesis-auth.sh tests/contracts/run-schemathesis-teacher-rbac.sh tests/contracts/run-teacher-comment-rbac.sh tests/contracts/run-teacher-export-rbac.sh
      - name: Prisma Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build:ci
      - run: |
          echo "Starting Next.js server..."
          E2E_DISABLE_RATE_LIMIT=1 npm run start > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
      - name: Attendre le démarrage du serveur (contract)
        run: |
          npx wait-on \
            --timeout 120000 \
            --interval 2000 \
            --httpTimeout 5000 \
            http://127.0.0.1:3000/api/v1/health || {
            echo "❌ Serveur contract non prêt après 120s"
            echo "--- Logs serveur ---"
            cat server.log || true
            echo "--- Processus Node ---"
            ps aux | grep -E "(next|node)" | grep -v grep || echo "Aucun processus Node"
            echo "--- Port 3000 ---"
            ss -tlnp | grep 3000 || echo "Port 3000 non écouté"
            echo "--- Health check direct ---"
            curl -s http://127.0.0.1:3000/api/v1/health || echo "Curl failed"
            exit 1
          }
          echo "✅ Serveur contract prêt"
      - name: Schemathesis public contracts
        run: npm run test:contracts | tee schemathesis-public.log
      - name: Schemathesis authenticated contracts
        run: npm run test:contracts:auth | tee schemathesis-auth.log
      - name: Schemathesis teacher RBAC contracts
        run: npm run test:contracts:teacher-rbac | tee schemathesis-teacher-rbac.log
      - name: Teacher comment RBAC assertions
        run: npm run test:contracts:teacher-comment-rbac | tee teacher-comment-rbac.log
      - name: Teacher export RBAC assertions
        run: npm run test:contracts:teacher-export-rbac | tee teacher-export-rbac.log
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-reports
          path: |
            schemathesis-public.log
            schemathesis-auth.log
            schemathesis-teacher-rbac.log
            teacher-comment-rbac.log
            teacher-export-rbac.log

  e2e-tests:
    name: "Gate 4 - Tests E2E Playwright"
    needs: [integration-tests, contract-tests]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-e2e-tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eaf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d eaf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      HEALTH_CHECK_READY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run build:worker
      - name: Reset DB, create extensions, and sync schema
        run: |
          PGPASSWORD=test psql -h localhost -U test -d eaf_test -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=test psql -h localhost -U test -d eaf_test -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"; CREATE EXTENSION IF NOT EXISTS "vector";'
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: DB Seed
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build:ci
      - run: |
          echo "Starting Next.js server for E2E..."
          E2E_DISABLE_RATE_LIMIT=1 npm run start > e2e-server.log 2>&1 &
          SERVER_PID=$!
          echo "E2E Server PID: $SERVER_PID"
          echo "Waiting for server..."
          npx wait-on \
            --timeout 120000 \
            --interval 2000 \
            --httpTimeout 5000 \
            http://127.0.0.1:3000/api/v1/health || {
            echo "❌ Serveur E2E non prêt après 120s"
            echo "--- Logs serveur ---"
            cat e2e-server.log || true
            echo "--- Processus Node ---"
            ps aux | grep -E "(next|node)" | grep -v grep || echo "Aucun processus Node"
            echo "--- Port 3000 ---"
            ss -tlnp | grep 3000 || echo "Port 3000 non écouté"
            echo "--- Health check direct ---"
            curl -s http://127.0.0.1:3000/api/v1/health || echo "Curl failed"
            exit 1
          }
          echo "✅ Serveur E2E prêt"
      - name: Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  security-scan:
    name: "Gate 5 - Securite"
    needs: unit-tests
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-security-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Secrets scan (GitLeaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail on real leaks (ignore stderr-only errors)
        if: steps.gitleaks.outcome == 'failure'
        run: |
          if [ -f results.sarif ]; then
            LEAKS=$(python3 -c "import json; d=json.load(open('results.sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo "0")
            if [ "$LEAKS" != "0" ]; then
              echo "::error::GitLeaks found $LEAKS secret(s). Review results.sarif."
              exit 1
            fi
            echo "GitLeaks exited non-zero but found 0 leaks (stderr noise). Passing."
          else
            echo "::warning::GitLeaks failed but no SARIF report found. Investigate manually."
          fi
      - name: Snyk vuln scan
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::SNYK_TOKEN not configured — skipping Snyk scan. Configure the secret to enable."
            exit 0
          fi
          npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: CodeQL init
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: typescript
      - name: Build for CodeQL
        if: steps.codeql-init.outcome == 'success'
        continue-on-error: true
        run: npm run build:ci
      - name: CodeQL analyze
        if: steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v3

  performance-tests:
    name: "Gate 5b - Performance Artillery"
    needs: integration-tests
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: ci-performance-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Artillery load test
        run: npx artillery run tests/performance/load-test.yml

  zap-security-tests:
    name: "Gate 5c - OWASP ZAP"
    needs: integration-tests
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1')
    concurrency:
      group: ci-zap-security-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ZAP active scan
        run: bash tests/security/run-zap.sh

  mutation-tests:
    name: "Gate 5d - Mutation Tests"
    needs: unit-tests
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')
    concurrency:
      group: ci-mutation-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Stryker mutation testing
        run: npm run test:mutation | tee stryker.log
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-reports
          path: |
            stryker.log
            reports/mutation
            .stryker-tmp/reports

  deploy-production:
    name: "Gate 6b - Deploy Production (Blue-Green)"
    needs: [e2e-tests, security-scan]
    if: |
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.npm/_cacache
            ~/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: "Check production secrets are configured"
        id: check-secrets
        run: |
          if [ -z "$PROD_DB" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production secrets not configured — skipping deploy"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROD_DB: ${{ secrets.PROD_DATABASE_URL }}
      - name: "Config sanity check (production)"
        if: steps.check-secrets.outputs.configured == 'true'
        run: NODE_ENV=production npm run ci:config-sanity
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          CSRF_SECRET: ${{ secrets.PROD_CSRF_SECRET }}
          MISTRAL_API_KEY: ${{ secrets.PROD_MISTRAL_API_KEY }}
          BILLING_CODE_PEPPER: ${{ secrets.PROD_BILLING_CODE_PEPPER }}
          STORAGE_PROVIDER: "s3"
          NEXT_PUBLIC_APP_URL: ${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}/api/v1
      - name: Blue-Green Deploy
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            ACTIVE=$(cat /etc/nginx/conf.d/active-slot.txt 2>/dev/null || echo "blue")
            OLD=$([ "$ACTIVE" = "blue" ] && echo "green" || echo "blue")
            NEXT=$([ "$ACTIVE" = "blue" ] && echo "green" || echo "blue")
            NEXT_PORT=$([ "$NEXT" = "blue" ] && echo "3000" || echo "3001")
            OLD_PORT=$([ "$OLD" = "blue" ] && echo "3000" || echo "3001")
            cd /var/www/eaf-$NEXT
            git fetch origin main --tags --prune
            git checkout ${{ github.sha }}
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            SLOT=$NEXT PORT=$NEXT_PORT pm2 startOrRestart ecosystem.config.cjs --only eaf-nextjs-$NEXT --env production --update-env
            SMOKE_OK=0
            for i in {1..30}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${NEXT_PORT}/api/v1/health")
              if [ "$STATUS" = "200" ]; then
                SMOKE_OK=1
                break
              fi
              sleep 2
            done
            if [ "$SMOKE_OK" = "0" ]; then
              echo "Smoke test failed on slot $NEXT ($NEXT_PORT). Cleaning up."
              pm2 delete eaf-nextjs-$NEXT || true
              exit 1
            fi
            echo $NEXT > /etc/nginx/conf.d/active-slot.txt
            nginx -s reload
            pm2 delete eaf-nextjs-$OLD || true
      - name: Smoke test post-déploiement
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "🔍 Vérification santé production..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://eaf.nexusreussite.academy/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Serveur répond HTTP 200 après $i tentative(s)"
              exit 0
            fi
            echo "⏳ Tentative $i/12 — HTTP $STATUS — attente 10s..."
            sleep 10
          done
          echo "❌ Serveur ne répond pas après 120s (Requis: HTTP 200)"
          exit 1

  post-deploy-monitoring:
    name: "Post-Deploy - Health & Canary"
    needs: deploy-production
    if: |
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Health check 5min
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://eaf.nexusreussite.academy/api/v1/health)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed (HTTP $STATUS)"; exit 1
            fi
            sleep 10
          done
