openapi: 3.0.3
info:
  title: Nexus EAF Teacher RBAC Forbidden Contracts
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/enseignant/dashboard:
    get:
      summary: Teacher dashboard forbidden for student role
      responses:
        '403':
          description: Access denied for non-teacher
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /api/v1/enseignant/class-code:
    post:
      summary: Class code generation forbidden for student role
      requestBody:
        required: false
      responses:
        '403':
          description: Access denied for non-teacher
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

