openapi: 3.0.3
info:
  title: Nexus EAF Authenticated API Contracts
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/rag/search:
    post:
      summary: Authenticated RAG search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                maxResults:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [query, results, citationsRequired]
                properties:
                  query: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, title, type, level, sourceRef, excerpt, score]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        type: { type: string }
                        level: { type: string }
                        sourceRef: { type: string }
                        excerpt: { type: string }
                        score: { type: number }
                  citationsRequired: { type: boolean }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /api/v1/epreuves/generate:
    post:
      summary: Generate written exam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type:
                  type: string
                  enum: [commentaire, dissertation, contraction_essai]
                oeuvre:
                  type: string
                  minLength: 1
                  maxLength: 200
                theme:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Generated exam
          content:
            application/json:
              schema:
                type: object
                required: [epreuveId, sujet, texte, consignes, bareme, generatedAt]
                properties:
                  epreuveId: { type: string }
                  sujet: { type: string }
                  texte: { type: string }
                  consignes: { type: string }
                  bareme:
                    type: object
                    additionalProperties:
                      type: number
                  generatedAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '429':
          description: LLM quota exceeded
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
