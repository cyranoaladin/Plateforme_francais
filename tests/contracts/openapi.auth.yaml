openapi: 3.0.3
info:
  title: Nexus EAF Authenticated API Contracts
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/rag/search:
    post:
      summary: Authenticated RAG search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                maxResults:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [query, results, citationsRequired]
                properties:
                  query: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, title, type, level, sourceRef, excerpt, score]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        type: { type: string }
                        level: { type: string }
                        sourceRef: { type: string }
                        excerpt: { type: string }
                        score: { type: number }
                  citationsRequired: { type: boolean }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /api/v1/tuteur/message:
    post:
      summary: Authenticated tutor message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
                conversationHistory:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        minLength: 1
                        maxLength: 4000
      responses:
        '200':
          description: Tutor answer
          content:
            application/json:
              schema:
                type: object
                required: [answer, citations, suggestions]
                properties:
                  answer: { type: string }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        title: { type: string }
                        source: { type: string }
                  suggestions:
                    type: array
                    items: { type: string }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: Plan quota exceeded
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  upgradeUrl: { type: string }
        '429':
          description: Rate limit or LLM quota
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /api/v1/oral/session/start:
    post:
      summary: Start oral session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oeuvre]
              properties:
                oeuvre:
                  type: string
                  minLength: 1
                  maxLength: 200
                extrait:
                  type: string
                  minLength: 1
                questionGrammaire:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Oral session started
          content:
            application/json:
              schema:
                type: object
                required:
                  [sessionId, texte, questionGrammaire, phraseGrammaire, oeuvreChoisie, instructions]
                properties:
                  sessionId: { type: string }
                  texte: { type: string }
                  questionGrammaire: { type: string }
                  phraseGrammaire: { type: string }
                  oeuvreChoisie: { type: string }
                  instructions: { type: string }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: Plan quota exceeded
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  upgradeUrl: { type: string }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /api/v1/epreuves/generate:
    post:
      summary: Generate written exam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [commentaire, dissertation, contraction_essai]
                oeuvre:
                  type: string
                  minLength: 1
                  maxLength: 200
                theme:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Generated exam
          content:
            application/json:
              schema:
                type: object
                required: [epreuveId, sujet, texte, consignes, bareme, generatedAt]
                properties:
                  epreuveId: { type: string }
                  sujet: { type: string }
                  texte: { type: string }
                  consignes: { type: string }
                  bareme:
                    type: object
                    additionalProperties:
                      type: number
                  generatedAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '429':
          description: LLM quota exceeded
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
