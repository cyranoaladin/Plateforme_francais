# ==============================================================================
# Nginx configuration for Nexus Réussite EAF
# Domain: eaf.nexusreussite.academy
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream Next.js
upstream nextjs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name eaf.nexusreussite.academy;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eaf.nexusreussite.academy;

    # SSL — sera configuré par certbot
    # ssl_certificate     /etc/letsencrypt/live/eaf.nexusreussite.academy/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eaf.nexusreussite.academy/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/eaf.access.log;
    error_log  /var/log/nginx/eaf.error.log;

    # Security headers (complémentaires à ceux de Next.js)
    add_header X-Robots-Tag "index, follow" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Max upload size (pour les copies d'élèves)
    client_max_body_size 50M;

    # Static assets — served directly from filesystem for correct MIME types
    # Next.js standalone mode does not serve .next/static; Nginx must do it.
    location /_next/static {
        alias /opt/eaf_platform/.next/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files
    location /public {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API routes — rate limited
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout for long AI requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Login — strict rate limiting
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block MCP internal routes
    location /mcp-internal/ {
        deny all;
        return 403;
    }

    # Main Next.js application
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
