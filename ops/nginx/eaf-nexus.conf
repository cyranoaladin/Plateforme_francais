# /etc/nginx/sites-available/eaf-nexus.conf
# NOTE: limit_req_zone doit être dans /etc/nginx/nginx.conf (http{})
# Ajouter ces deux lignes dans nginx.conf section http{} sur le serveur :
#   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Upstream dynamique blue-green — ce fichier est régénéré par le CI à chaque deploy
include /etc/nginx/conf.d/upstream-active.conf;

server {
    listen 80;
    server_name eaf.nexusreussite.academy;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eaf.nexusreussite.academy;

    ssl_certificate /etc/letsencrypt/live/eaf.nexusreussite.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaf.nexusreussite.academy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EAFSSL:10m;
    ssl_session_timeout 1d;

    # Next.js gère seul les headers sécurité: X-Frame-Options, CSP nonce,
    # X-Content-Type-Options, Referrer-Policy et Permissions-Policy.
    # NE PAS dupliquer ces headers ici — double header = comportement non défini.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    access_log /var/log/nginx/eaf-access.log;
    error_log /var/log/nginx/eaf-error.log;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://eaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://eaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://eaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/health {
        proxy_pass http://eaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://eaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|log|git|gitignore|sql|bak|backup)$ {
        deny all;
        return 404;
    }
}
