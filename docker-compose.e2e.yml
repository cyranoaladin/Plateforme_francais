# Docker Compose pour environnement de test E2E
# Usage: docker compose -f docker-compose.e2e.yml up -d

services:
  postgres-e2e:
    image: pgvector/pgvector:pg16
    container_name: eaf-postgres-e2e
    environment:
      POSTGRES_USER: eaf_test
      POSTGRES_PASSWORD: eaf_test_password
      POSTGRES_DB: eaf_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaf_test -d eaf_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    container_name: eaf-redis-e2e
    ports:
      - "6380:6379"
    volumes:
      - redis_e2e_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_e2e_data:
  redis_e2e_data:
